<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(title='Redefinição de senha', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <p style="margin:0 0 8px; font-size:15px; line-height:24px; color:#3A3A44;">Olá!</p>
    <p style="margin:0 0 28px; font-size:15px; line-height:24px; color:#3A3A44;">
        Recebemos um pedido para redefinir a senha da sua conta no ThreatLens. Use o código abaixo para continuar.
    </p>
    <th:block th:replace="~{email/fragments :: code-box(${code})}"></th:block>
    <th:block th:replace="~{email/fragments :: notice('Não pediu a redefinição? Ignore este e-mail. Sua senha continua a mesma.')}"></th:block>
</th:block>
</body>
</html>
