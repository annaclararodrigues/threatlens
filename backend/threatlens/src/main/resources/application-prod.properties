# Atrás do Nginx: usa X-Forwarded-For para obter o IP real do cliente (rate limit e auditoria)
server.forward-headers-strategy=native

# Banco primário: definido via SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Posts (secondary datasource) ----
posts.datasource.url=${POSTS_DB_URL}
posts.datasource.username=${POSTS_DB_USERNAME}
posts.datasource.password=${POSTS_DB_PASSWORD}

# ---- E-mail (Gmail) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:threatlens2025@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# true exige HTTPS; sobrescreva com COOKIE_SECURE=false para servir em HTTP puro
cookie.secure=${COOKIE_SECURE:true}
