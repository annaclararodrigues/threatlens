name: threatlens

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - threatlens_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d threatlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend/threatlens
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/threatlens
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      POSTS_DB_URL: ${POSTS_DB_URL:?defina POSTS_DB_URL no .env}
      POSTS_DB_USERNAME: ${POSTS_DB_USERNAME:?defina POSTS_DB_USERNAME no .env}
      POSTS_DB_PASSWORD: ${POSTS_DB_PASSWORD:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-threatlens2025@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Permite acessar serviços da máquina host (ex.: o banco asgard) via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sem "ports": a API só é acessível pela rede interna, através do Nginx do front (/api)

  front:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  threatlens_db_data:
