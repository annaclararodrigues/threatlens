spring.application.name=threatlens
spring.profiles.active=dev
jwt.secret=${JWT_SECRET}
jwt.expiration=300000

# ---- Bootstrap do primeiro administrador ----
# Necessário apenas quando ainda não existe nenhum usuário com role ADMIN.
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.username=${ADMIN_USERNAME:admin}
admin.bootstrap.password=${ADMIN_PASSWORD:}
